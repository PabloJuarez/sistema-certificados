<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Certificados</title>
  <!-- Supabase SDK original -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header / Barra superior -->
  <header class="bg-slate-900 text-white py-6 shadow-md mb-8">
    <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
        📜 Control de Certificados
      </h1>
      <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">Producción</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 space-y-8">
    
    <!-- Tarjeta: Formulario -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
      <div class="mb-6">
        <h2 class="text-lg font-bold text-slate-900">Registrar Nuevo Certificado</h2>
        <p class="text-sm text-slate-500">Ingresa los detalles para programar la alerta automática de vencimiento.</p>
      </div>

      <form id="cert-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Certificado</label>
          <input type="text" id="nombre" placeholder="Nombre del certificado (ej. Licencia Software)" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Creación:</label>
            <input type="date" id="fecha_creacion" required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Vencimiento:</label>
            <input type="date" id="fecha_vencimiento" required
              class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo Notificación</label>
          <input type="email" id="email" placeholder="Correo para recibir la alerta" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
        </div>

        <button type="submit"
          class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-sm hover:shadow transition duration-200 text-sm">
          Guardar Certificado
        </button>
      </form>
    </section>

    <!-- Tarjeta: Tabla -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-6 border-b border-slate-100">
        <h2 class="text-lg font-bold text-slate-900">Certificados Guardados</h2>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
              <th class="py-3.5 px-6">Certificado</th>
              <th class="py-3.5 px-6">Vencimiento</th>
              <th class="py-3.5 px-6">Notificación</th>
            </tr>
          </thead>
          <tbody id="cert-table-body" class="divide-y divide-slate-100">
            <!-- Tu app.js inyectará las filas aquí de manera normal -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
